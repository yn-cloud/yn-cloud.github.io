<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% seo %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <nav class="site-nav">
                <div class="language-switch">
                    {% if page.lang == 'ja' %}
                    <a href="{{ '/index.html' | relative_url }}">English</a>
                    {% else %}
                    <a href="{{ '/index_ja.html' | relative_url }}">日本語</a>
                    {% endif %}
                </div>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="social-links">
                <a href="https://github.com/{{ site.github_username }}" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="https://twitter.com/{{ site.twitter_username }}" target="_blank"><i class="fab fa-x-twitter"></i></a>
                <a href="mailto:{{ site.email }}"><i class="fas fa-envelope"></i></a>
            </div>
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.name }}. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
